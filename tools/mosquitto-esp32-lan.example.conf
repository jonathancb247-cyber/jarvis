# JarvisOS Phase 12.4 ESP32 MQTT LAN validation template.
#
# Copy this file to an untracked local file before use, then replace
# <PC_LAN_IP> with the host interface address reachable by the ESP32.
#
# JarvisOS still connects to 127.0.0.1. The ESP32 connects to the LAN listener.
# This template is for trusted local lab validation only. It is not production
# broker guidance.

listener 1883 127.0.0.1
listener 1883 <PC_LAN_IP>
allow_anonymous true
persistence false
